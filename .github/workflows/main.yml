name: Mirror

on:
  workflow_dispatch:
  push:
    branches:
    - master
  schedule:
  - cron: '40 8 * * *'

permissions:
  contents: write

jobs:
  mirror:
    name: main
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Get upstream asterisklint version
      id: get-version
      uses: sarnold/action-pypi-version@v1
      with:
        package_name: asterisklint

    - name: Set git user info
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

    - name: Get current version
      run: |
        CUR_VER=$(cat version.txt)
        echo "CUR_VER=$CUR_VER" >> $GITHUB_ENV
        echo "current: $CUR_VER"

    - name: Create and push mirror tag (conditional)
      run: |
        if [ "$NEW" != "$OLD" ]
        then
            echo "$NEW" > version.txt
            git add version.txt
            git commit -m "Mirror: ${{ env.UP_VER }}"
            git tag v${{ env.UP_VER }} -a -m "new upstream tag"
            git remote set-url origin https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY
            git push origin HEAD:refs/heads/master --tags
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW: ${{ steps.get-version.outputs.package_version }}
        OLD: ${{ env.CUR_VER }}
